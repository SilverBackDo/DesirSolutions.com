name: Publish and deploy Desir Solutions website image

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.image.outputs.owner }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref_name }}

      - name: Normalize image metadata
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website image
        uses: docker/build-push-action@v6
        with:
          context: website
          file: website/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/desirsolutions-website:latest
            ghcr.io/${{ steps.image.outputs.owner }}/desirsolutions-website:${{ steps.image.outputs.tag }}

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Website Image Published"
            echo
            echo "- Latest: \`ghcr.io/${{ steps.image.outputs.owner }}/desirsolutions-website:latest\`"
            echo "- Commit tag: \`ghcr.io/${{ steps.image.outputs.owner }}/desirsolutions-website:${{ steps.image.outputs.tag }}\`"
            echo
            echo "Image is on GHCR. Deploy to Proxmox CT 114 (proxy-ds01) requires:"
            echo "  - Root access on hypervisor (devprox99p01) to use \`pct\`, \`lxc-attach\`, or mount LVM"
            echo "  - OR SSH access to CT 114 to use podman inside the container"
            echo "  - OR a deploy mechanism that works with devlion's privileges"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: [self-hosted, desir-prod-deploy]
    needs: publish
    steps:
      - name: Check deploy prerequisites
        id: deploy_prereqs
        env:
          PROXMOX_HOST: ${{ vars.PROXMOX_HOST || secrets.PROXMOX_HOST || '10.225.1.50' }}
          PROXMOX_USER: ${{ vars.PROXMOX_USER || secrets.PROXMOX_USER || 'devlion' }}
        run: |
          set -euo pipefail
          # All prerequisites have defaults (hypervisor IP + devlion user)
          # SSH key comes from the runner's SSH agent (devlion's key for hypervisor)
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH trust
        if: steps.deploy_prereqs.outputs.ready == 'true'
        env:
          PROXMOX_HOST: ${{ vars.PROXMOX_HOST || secrets.PROXMOX_HOST || '10.225.1.50' }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H "$PROXMOX_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify Proxmox deploy path
        if: steps.deploy_prereqs.outputs.ready == 'true'
        env:
          PROXMOX_HOST: ${{ vars.PROXMOX_HOST || secrets.PROXMOX_HOST || '10.225.1.50' }}
          PROXMOX_USER: ${{ vars.PROXMOX_USER || secrets.PROXMOX_USER || 'devlion' }}
          WEBSITE_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/desirsolutions-website:${{ needs.publish.outputs.tag }}
          WEBSITE_PUBLIC_HOST: ${{ vars.WEBSITE_PUBLIC_HOST || 'desirsolutions.com' }}
        run: |
          set -euo pipefail

          echo "═══════════════════════════════════════════════════════════════"
          echo "  DesirSolutions.com — Proxmox Deployment Verification"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Hypervisor: $PROXMOX_HOST"
          echo "User:       $PROXMOX_USER"
          echo "Image:      $WEBSITE_IMAGE"
          echo "Public:     $WEBSITE_PUBLIC_HOST"
          echo ""
          echo "───────────────────────────────────────────────────────────────"
          echo "  DEPLOY PATH VERIFICATION"
          echo "───────────────────────────────────────────────────────────────"
          echo ""

          # Write verification script to temp file, then SSH execute
          # (avoids heredoc-in-YAML indentation issues)
          VERIFY_SCRIPT="$HOME/.verify_proxmox.sh"
          cat > "$VERIFY_SCRIPT" <<'INNEREOF'
            set -euo pipefail
            echo "Running on hypervisor as: $(whoami) (uid=$(id -u))"
            echo ""
            echo "── CT 114 (proxy-ds01) status ──"
            echo "  Config: $(test -f /var/lib/lxc/114/config && grep -E 'lxc.idmap|lxc.rootfs.path|lxc.uts.name' /var/lib/lxc/114/config || echo 'NOT FOUND')"
            echo "  Rootfs: $(ls -la /var/lib/lxc/114/rootfs 2>&1 | head -3)"
            echo "  Nginx:  $(ps aux 2>/dev/null | grep -E 'nginx.*master' | grep '100000' | head -1 || echo 'NOT FOUND')"
            echo "  Podman: $(ps aux 2>/dev/null | grep -E 'podman run' | grep '100000' | head -3 || echo 'NOT FOUND')"
            echo ""
            echo "── Access tests ──"
            echo "  Can read /var/lib/lxc/114/rootfs: $(test -r /var/lib/lxc/114/rootfs && echo YES || echo NO)"
            echo "  Can write to /var/lib/lxc/114/rootfs: $(test -w /var/lib/lxc/114/rootfs && echo YES || echo NO)"
            echo "  Can SSH into CT 114: $(ssh -o ConnectTimeout=3 -o StrictHostKeyChecking=no 10.225.1.114 'echo ok' 2>&1 | head -1 || echo FAILED)"
            echo "  Can use pct: $(which pct 2>/dev/null || echo NOT FOUND)"
            echo "  Can use lxc-attach: $(which lxc-attach 2>/dev/null || echo NOT FOUND)"
            echo "  Can use skopeo: $(which skopeo 2>/dev/null || echo NOT FOUND)"
            echo "  Can use podman: $(which podman 2>/dev/null || echo NOT FOUND)"
            echo ""
            echo "── Network: can hypervisor reach GHCR? ──"
            echo "  ghcr.io: $(curl -s -m 5 -o /dev/null -w '%{http_code}' https://ghcr.io || echo TIMEOUT)"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  DEPLOY PATH: BLOCKED"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "CT 114 (proxy-ds01) runs nginx + podman inside an LXC container"
            echo "with user namespace mapping: CT uid 0 → host uid 100000."
            echo ""
            echo "As devlion (uid 1000) on the hypervisor:"
            echo "  ✗ Cannot read/write CT 114 rootfs (/var/lib/lxc/114/rootfs)"
            echo "  ✗ Cannot SSH into CT 114 (all auth methods rejected)"
            echo "  ✗ Cannot use pct/lxc-attach (requires root/sudo)"
            echo "  ✗ Cannot use podman (not installed for devlion)"
            echo "  ✓ Can reach GHCR from hypervisor (network works)"
            echo "  ✓ Can run skopeo to download images to /tmp (writable)"
            echo ""
            echo "The publish job has pushed the image to GHCR."
            echo "To complete deployment to CT 114, one of these is required:"
            echo ""
            echo "  Option A — Root access on hypervisor:"
            echo "    pct exec 114 -- podman pull ghcr.io/silverbackdo/desirsolutions-website:LATEST"
            echo "    pct exec 114 -- podman tag ... && pct exec 114 -- podman stop/start ..."
            echo ""
            echo "  Option B — SSH into CT 114:"
            echo "    ssh root@10.225.1.114 'podman pull ... && podman tag ... && podman stop/start ...'"
            echo ""
            echo "  Option C — LVM volume mount (temporary):"
            echo "    mount /dev/mapper/pve-vm--114--disk--0 /mnt/ct114"
            echo "    cp /tmp/desirsolutions-website.tar /mnt/ct114/tmp/"
            echo "    umount /mnt/ct114"
            echo "    Then inside CT 114: podman load -i /tmp/desirsolutions-website.tar"
            echo ""
            echo "NOTE: OCI VM (170.9.21.103) is DECOMMISSIONED."
            echo "All deployment targets now point to Proxmox CT 114."
          INNEREOF
          chmod +x "$VERIFY_SCRIPT"

          # SSH to hypervisor and run the verification script
          ssh -i "$HOME/.ssh/id_ed25519_devprox99p01" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$PROXMOX_USER@$PROXMOX_HOST" bash "$VERIFY_SCRIPT"

      - name: Publish deploy summary
        if: steps.deploy_prereqs.outputs.ready == 'true'
        env:
          WEBSITE_PUBLIC_URL: ${{ vars.WEBSITE_PUBLIC_URL || 'https://desirsolutions.com/' }}
          WEBSITE_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/desirsolutions-website:${{ needs.publish.outputs.tag }}
        run: |
          {
            echo "## Website Deployment Verification"
            echo
            echo "- **Image**: \`${WEBSITE_IMAGE}\`"
            echo "- **Route**: \`${WEBSITE_PUBLIC_URL}\`"
            echo "- **Deploy status**: 🔴 **BLOCKED** — CT 114 inaccessible from devlion"
            echo
            echo "The **publish job** has successfully pushed the website image to GHCR."
            echo "The **deploy job** has verified the Proxmox deployment path."
            echo
            echo "### What works"
            echo
            echo "- ✅ Image builds and pushes to GHCR (publish job)"
            echo "- ✅ Hypervisor reachable via SSH as devlion"
            echo "- ✅ Network from hypervisor to GHCR works"
            echo "- ✅ skopeo available on hypervisor (can download images to /tmp)"
            echo
            echo "### What's blocked"
            echo
            echo "- ❌ Cannot read/write CT 114 rootfs (user namespace: uid 0 → 100000)"
            echo "- ❌ Cannot SSH into CT 114 (all auth methods rejected)"
            echo "- ❌ Cannot use pct/lxc-attach (requires root/sudo)"
            echo "- ❌ Cannot use podman (not installed for devlion)"
            echo
            echo "### Requirements to complete deployment"
            echo
            echo "1. **Root access on hypervisor** — to use \`pct exec 114\`, \`lxc-attach\`, or mount LVM volume"
            echo "2. **SSH access to CT 114** — to use podman inside the container"
            echo "3. **A deploy mechanism** that works with devlion's privileges"
            echo
            echo "### OCI artifacts removed"
            echo
            echo "- ✅ Deploy.yml no longer references OCI_VM_HOST, OCI_VM_USER, OCI_VM_SSH_KEY"
            echo "- ✅ OCI VM (170.9.21.103) is decommissioned"
            echo "- ✅ All deployment targets now point to Proxmox CT 114 (10.225.1.114)"
          } >> "$GITHUB_STEP_SUMMARY"
